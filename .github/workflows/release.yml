# Push a version tag to build Linux (.deb, AppImage) + Windows (.msi) and publish a GitHub Release.
# Example: bump version in package.json + tauri.conf.json + Cargo.toml, then:
#   git tag v0.3.0 && git push origin v0.3.0

name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Academy Manager v__VERSION__
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            **Linux Mint / Ubuntu:** install the `.deb` (or run the AppImage).
            **Windows:** install the `.msi`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
